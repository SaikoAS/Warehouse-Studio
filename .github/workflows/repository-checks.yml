name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/phase-1-bootstrap]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-config:
    name: docs-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned configuration parser
        run: python3 -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Validate repository documents and configuration
        run: python3 scripts/check_repository.py
      - name: Check changed-line whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git show --format= --check HEAD
          else
            git diff --check "$base" HEAD
          fi
