name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/phase-1-bootstrap]

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-config:
    name: docs-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned configuration parser
        run: python3 -m pip install --disable-pip-version-check -r .github/requirements-ci.txt
      - name: Validate repository documents and configuration
        run: python3 scripts/check_repository.py
      - name: Check changed-line whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git show --format= --check HEAD
          else
            git diff --check "$base" HEAD
          fi

  windows-app:
    name: Windows application
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Node for the build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.1'
      - name: Select the supported Python line
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Type-check React and Vite configuration
        run: npm run typecheck
      - name: Build the production interface
        run: npm run build
      - name: Run Python runtime and Windows launcher smoke tests
        run: python -m unittest discover -s tests -v
      - name: Exercise the project launcher and CSV workflow in Microsoft Edge
        run: npm run test:edge
      - name: Build the Windows ZIP candidate
        run: python scripts/package_windows.py (Join-Path $env:RUNNER_TEMP 'Warehouse-Studio-v0.1.0-windows.zip')
      - name: Upload the Windows ZIP for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Windows-ZIP
          path: ${{ runner.temp }}/Warehouse-Studio-v0.1.0-windows.zip
          if-no-files-found: error
